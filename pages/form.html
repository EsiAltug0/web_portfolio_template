</head>

    <!-- Navigation -->

        <div class="nav-container">
            <!-- Logo -->

            <!-- Desktop menu -->
            <div class="nav-menu" id="navMenu">
                <a href="../index.html" class="nav-link">ANA SAYFA</a>

                <a href="form.html" class="nav-link">FORM</a>
            </div>

            <!-- Year badge -->
            <div class="year-badge">2026</div>

            <!-- Mobile menu button -->
            <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">
                <span></span>

                <span></span>
            </button>

        <!-- Mobile menu -->
        <div class="mobile-menu" id="mobileMenu">
            <a href="../index.html" class="nav-link">ANA SAYFA</a>
            <a href="about.html" class="nav-link">HAKKIMDA</a>
            <a href="project.html" class="nav-link">BECERİLER</a>
            <a href="project.html" class="nav-link">PROJELER</a>
            <a href="contact.html" class="nav-link">İLETİŞİM</a>
            <a href="form.html" class="nav-link">FORM</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <section class="form-section">
            <div class="section-header">
                <h2 class="section-number">05</h2>
                <h1 class="section-title">İSTEK / ŞİKAYET / MEKTUP</h1>
            </div>

            <div class="form-container">
                <form class="contact-form" id="contactForm" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
                    <div class="form-group">
                        <label for="name">Adınız *</label>
                        <input type="text" id="name" name="name" placeholder="Adınızı giriniz" required>
                        <span class="error-message" id="nameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">E-Posta Adresiniz *</label>
                        <input type="email" id="email" name="email" placeholder="E-posta adresinizi giriniz" required>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Telefon Numaranız</label>
                        <input type="tel" id="phone" name="phone" placeholder="Telefon numaranızı giriniz">
                    </div>

                    <div class="form-group">
                        <label for="type">İçerik Türü *</label>
                        <select id="type" name="type" required>
                            <option value="">Seçiniz</option>
                            <option value="istek">İstek</option>
                            <option value="sikayet">Şikayet</option>
                            <option value="mektup">Mektup</option>
                            <option value="diger">Diğer</option>
                        </select>
                        <span class="error-message" id="typeError"></span>
                    </div>

                    <div class="form-group">
                        <label for="subject">Konu *</label>
                        <input type="text" id="subject" name="subject" placeholder="Konuyu giriniz" required>
                        <span class="error-message" id="subjectError"></span>
                    </div>

                    <div class="form-group">
                        <label for="message">Mesaj *</label>
                        <textarea id="message" name="message" placeholder="Mesajınızı giriniz" rows="6" required></textarea>
                        <span class="error-message" id="messageError"></span>
                    </div>

                    <div class="form-group checkbox">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">Verilerimin işlenmesine izin veriyorum *</label>
                        <span class="error-message" id="termsError"></span>
                    </div>

                    <button type="submit" class="submit-btn">GÖNDER</button>
                </form>

                <div id="successMessage" class="success-message" style="display: none;">
                    <h2>✓ Mesajınız başarıyla gönderildi!</h2>
                    <p>En kısa sürede sizinle iletişime geçeceğim.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="../assests/js/script.js"></script>
</body>
</html>
