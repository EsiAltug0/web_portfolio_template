<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form | Esma Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assests/css/style.css">
</head>
<body>
    <div class="scanline-overlay"></div>
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-logo">E<span class="logo-dot">.</span></a>
            <div class="nav-menu" id="navMenu">
                <a href="../index.html" class="nav-link">ANA SAYFA</a>
                <a href="about.html" class="nav-link">HAKKIMDA</a>
                <a href="project.html" class="nav-link">PROJELER</a>
                <a href="contact.html" class="nav-link">İLETİŞİM</a>
                <a href="form.html" class="nav-link active">FORM</a>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <a href="../index.html" class="nav-link">ANA SAYFA</a>
            <a href="about.html" class="nav-link">HAKKIMDA</a>
            <a href="project.html" class="nav-link">PROJELER</a>
            <a href="contact.html" class="nav-link">İLETİŞİM</a>
            <a href="form.html" class="nav-link active">FORM</a>
        </div>
    </nav>

    <main class="pages-container">
        <section class="page active">
            <div class="section-container">
                <div class="section-header"><span class="section-number">04</span><div class="section-divider"></div></div>
                <h2 class="section-title">İSTEK / ŞİKAYET / MEKTUP</h2>
                <div class="form-container">
                    <form id="contactForm" class="contact-form" action="#" method="POST">
                        <div class="form-group">
                            <label for="name">Adınız *</label>
                            <input type="text" id="name" name="name" required placeholder="Adınızı giriniz">
                            <span class="error-message" id="nameError"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">E-Posta Adresiniz *</label>
                            <input type="email" id="email" name="email" required placeholder="E-posta adresinizi giriniz">
                            <span class="error-message" id="emailError"></span>
                        </div>
                        <div class="form-group">
                            <label for="message">Mesajınız *</label>
                            <textarea id="message" name="message" required placeholder="Mesajınızı giriniz" rows="5"></textarea>
                            <span class="error-message" id="messageError"></span>
                        </div>
                        <div class="form-group checkbox">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">Verilerimin işlenmesine izin veriyorum *</label>
                        </div>
                        <button type="submit" class="submit-btn">GÖNDER</button>
                    </form>
                    <div id="successMessage" class="success-message" style="display: none;">
                        <div class="success-icon">✓</div>
                        <h3>Mesaj Başarıyla Gönderildi!</h3>
                        <a href="../index.html" class="btn-home" style="display:inline-block; text-decoration:none;">Ana Sayfaya Dön</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="../assests/js/script.js"></script>
</body>
</html>
