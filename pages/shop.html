<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mağaza | Esma Portfolio 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assests/css/style.css">
</head>
<body>
    <div class="scanline-overlay"></div>

    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-logo" style="text-decoration: none;">
                E<span class="logo-dot">.</span>
            </a>
            <div class="nav-menu" id="navMenu">
                <a href="../index.html" class="nav-link">ANA SAYFA</a>
                <a href="about.html" class="nav-link">HAKKIMDA</a>
                <a href="project.html" class="nav-link">PROJELER</a>
                <a href="shop.html" class="nav-link">MAĞAZA</a>
                <a href="contact.html" class="nav-link">İLETİŞİM</a>
                <a href="form.html" class="nav-link">FORM</a>
            </div>
            <div class="year-badge">
                <span class="pulse-dot"></span>
                2026
            </div>
            <button class="theme-toggle" id="themeToggle" title="Tema Değiştir">☀️</button>
            <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <a href="../index.html" class="nav-link">ANA SAYFA</a>
            <a href="about.html" class="nav-link">HAKKIMDA</a>
            <a href="project.html" class="nav-link">PROJELER</a>
            <a href="shop.html" class="nav-link">MAĞAZA</a>
            <a href="contact.html" class="nav-link">İLETİŞİM</a>
            <a href="form.html" class="nav-link">FORM</a>
        </div>
    </nav>

    <main class="pages-container">
        <section id="page-shop" class="page active">
            <div class="section-container">
                <div class="section-header">
                    <span class="section-number">07</span>
                    <div class="section-divider"></div>
                </div>
                <h2 class="section-title">MAĞAZA</h2>

                <!-- Arama ve Filtreleme -->
                <div class="shop-controls">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Ürün ara..." class="search-input">
                        <span class="search-icon">🔍</span>
                    </div>
                    <div class="category-filters">
                        <button class="filter-btn active" data-category="all">Tümü</button>
                        <button class="filter-btn" data-category="grafik">Grafik</button>
                        <button class="filter-btn" data-category="sosyal-medya">Sosyal Medya</button>
                        <button class="filter-btn" data-category="web">Web</button>
                        <button class="filter-btn" data-category="animasyon">Animasyon</button>
                    </div>
                    <div class="sort-controls">
                        <select id="sortSelect" class="sort-select">
                            <option value="default">Sıralama</option>
                            <option value="price-asc">Fiyat: Düşük → Yüksek</option>
                            <option value="price-desc">Fiyat: Yüksek → Düşük</option>
                            <option value="name-asc">İsim: A → Z</option>
                        </select>
                    </div>
                </div>

                <!-- Favoriler Sayacı -->
                <div class="favorites-counter">
                    <span>❤️ Favorilerim: <span id="favCount">0</span></span>
                </div>

                <!-- Ürün Listesi -->
                <div class="products-grid" id="productsGrid">
                    <p class="loading-text">Ürünler yükleniyor...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="../index.html" class="footer-logo" style="text-decoration: none;">E<span class="logo-dot">.</span></a>
        <p class="footer-text">© 2026 Esma — Tüm hakları saklıdır</p>
        <div class="footer-location">
            <span class="location-dot"></span>
            <span>Kırşehir, TR</span>
        </div>
    </footer>

    <script src="../assests/js/script.js"></script>
    <script src="../assests/js/shop.js"></script>
</body>
</html>
