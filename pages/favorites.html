<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorilerim | Esma Portfolio 2026</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assests/css/style.css">
    <style>
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 2rem; margin-top: 2rem; }
        .product-card { border: 2px solid var(--border); border-radius: 12px; overflow: hidden; transition: all 0.3s; background: var(--bg-secondary); }
        .product-card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,255,255,0.2); }
        .product-image { position: relative; width: 100%; height: 200px; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .product-card:hover .product-image img { transform: scale(1.05); }
        .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .fav-btn:hover { background: rgba(255,68,68,0.8); }
        .product-info { padding: 1.5rem; }
        .product-category { display: inline-block; padding: 0.3rem 0.8rem; background: rgba(0,255,255,0.1); color: var(--primary); border-radius: 4px; font-size: 0.8rem; margin-bottom: 0.5rem; }
        .product-name { font-size: 1.1rem; margin: 0.5rem 0; color: var(--text); font-family: 'Orbitron', sans-serif; }
        .product-description { font-size: 0.9rem; color: var(--text-light); margin-bottom: 1rem; line-height: 1.4; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .product-price { font-size: 1.2rem; color: var(--primary); font-weight: bold; font-family: 'Orbitron', sans-serif; }
        .add-to-cart-btn { padding: 0.5rem 1rem; background: var(--primary); color: var(--bg); border: none; border-radius: 6px; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 600; transition: all 0.3s; }
        .add-to-cart-btn:hover { opacity: 0.85; transform: scale(1.05); }
        .empty-favs { text-align: center; padding: 4rem 2rem; color: var(--text-light); }
        .empty-favs .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="scanline-overlay"></div>
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-logo" style="text-decoration:none;">E<span class="logo-dot">.</span></a>
            <div class="nav-menu" id="navMenu">
                <a href="../index.html" class="nav-link">ANA SAYFA</a>
                <a href="about.html" class="nav-link">HAKKIMDA</a>
                <a href="project.html" class="nav-link">PROJELER</a>
                <a href="shop.html" class="nav-link">MAĞAZA</a>
                <a href="contact.html" class="nav-link">İLETİŞİM</a>
                <a href="form.html" class="nav-link">FORM</a>
                <div id="navAuthArea"></div>
            </div>
            <div class="year-badge"><span class="pulse-dot"></span>2026</div>
            <button class="theme-toggle" id="themeToggle" title="Tema Değiştir">☀️</button>
            <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <a href="../index.html" class="nav-link">ANA SAYFA</a>
            <a href="about.html" class="nav-link">HAKKIMDA</a>
            <a href="project.html" class="nav-link">PROJELER</a>
            <a href="shop.html" class="nav-link">MAĞAZA</a>
            <a href="contact.html" class="nav-link">İLETİŞİM</a>
            <a href="form.html" class="nav-link">FORM</a>
        </div>
    </nav>

    <main class="pages-container">
        <section class="page active">
            <div class="section-container">
                <div class="section-header">
                    <span class="section-number">♥</span>
                    <div class="section-divider"></div>
                </div>
                <h2 class="section-title">FAVORİLERİM</h2>
                <div id="favsGrid" class="products-grid"><p class="no-data">Yükleniyor...</p></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="../index.html" class="footer-logo" style="text-decoration:none;">E<span class="logo-dot">.</span></a>
        <p class="footer-text">© 2026 Esma — Tüm hakları saklıdır</p>
        <div class="footer-location"><span class="location-dot"></span><span>Kırşehir, TR</span></div>
    </footer>

    <script src="../assests/js/script.js"></script>
    <script>
    let allProducts = [];
    let favorites = JSON.parse(localStorage.getItem('shopFavorites') || '[]');

    async function renderFavorites() {
        const grid = document.getElementById('favsGrid');
        try {
            const res = await fetch('../data/products.json');
            const data = await res.json();
            allProducts = data.products;
        } catch(e) {
            grid.innerHTML = '<p class="no-data">Ürünler yüklenemedi.</p>';
            return;
        }

        const favProducts = allProducts.filter(p => favorites.includes(p.id));
        if (!favProducts.length) {
            grid.innerHTML = `
                <div class="empty-favs" style="grid-column:1/-1">
                    <div class="empty-icon">🤍</div>
                    <p>Henüz favori ürününüz yok.</p>
                    <a href="shop.html" style="display:inline-block;margin-top:1rem;padding:0.8rem 2rem;background:var(--primary);color:var(--bg);text-decoration:none;border-radius:8px;font-family:'Orbitron',sans-serif;font-size:0.85rem;font-weight:700;">MAĞAZAYA GİT</a>
                </div>`;
            return;
        }

        grid.innerHTML = favProducts.map(p => `
            <div class="product-card">
                <div class="product-image">
                    <img src="${p.image}" alt="${p.name}">
                    <button class="fav-btn" onclick="removeFav(${p.id})" title="Favorilerden Çıkar">❤️</button>
                </div>
                <div class="product-info">
                    <span class="product-category">${p.category}</span>
                    <h3 class="product-name">${p.name}</h3>
                    <p class="product-description">${p.description}</p>
                    <div class="product-footer">
                        <span class="product-price">${p.price.toLocaleString('tr-TR')} ₺</span>
                        <button class="add-to-cart-btn" onclick="addToCartFromFav(${p.id})">Sepete Ekle</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function removeFav(id) {
        favorites = favorites.filter(f => f !== id);
        localStorage.setItem('shopFavorites', JSON.stringify(favorites));
        renderFavorites();
    }

    function addToCartFromFav(id) {
        let cart = JSON.parse(localStorage.getItem('shopCart') || '[]');
        if (!cart.includes(id)) { cart.push(id); localStorage.setItem('shopCart', JSON.stringify(cart)); }
        updateCartBadge();
        const p = allProducts.find(x => x.id === id);
        if(p) showToast(`${p.name} sepete eklendi! 🛒`);
    }

    renderFavorites();
    </script>
</body>
</html>
