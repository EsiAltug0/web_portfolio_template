<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepet | Esma Portfolio 2026</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assests/css/style.css">
    <style>
        .cart-grid { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; margin-top: 2rem; }
        @media(max-width:900px){ .cart-grid { grid-template-columns: 1fr; } }
        .cart-items-list { display: flex; flex-direction: column; gap: 1rem; }
        .cart-item { display: flex; align-items: center; gap: 1.5rem; background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 12px; padding: 1.2rem; transition: all 0.3s; }
        .cart-item:hover { border-color: var(--primary); }
        .cart-item-img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; color: var(--text); margin-bottom: 0.3rem; }
        .cart-item-cat { font-size: 0.8rem; color: var(--primary); margin-bottom: 0.4rem; }
        .cart-item-price { font-size: 1.1rem; font-weight: bold; color: var(--primary); font-family: 'Orbitron', sans-serif; }
        .cart-item-remove { background: transparent; border: 2px solid #ff4444; color: #ff4444; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: all 0.3s; flex-shrink: 0; }
        .cart-item-remove:hover { background: #ff4444; color: #fff; }
        .cart-summary { background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 12px; padding: 1.5rem; position: sticky; top: 90px; height: fit-content; }
        .cart-summary h3 { font-family: 'Orbitron', sans-serif; color: var(--primary); margin-bottom: 1.5rem; font-size: 1rem; }
        .summary-row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .summary-row.total { border-bottom: none; font-size: 1.2rem; font-weight: bold; color: var(--primary); font-family: 'Orbitron', sans-serif; margin-top: 0.5rem; }
        .checkout-btn { width: 100%; padding: 1rem; background: var(--primary); color: var(--bg); border: none; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; cursor: pointer; margin-top: 1.5rem; transition: all 0.3s; font-weight: 700; }
        .checkout-btn:hover { opacity: 0.85; transform: translateY(-2px); }
        .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .empty-cart { text-align: center; padding: 4rem 2rem; color: var(--text-light); }
        .empty-cart .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
        .empty-cart p { margin-bottom: 1.5rem; }
        .go-shop-btn { display: inline-block; padding: 0.8rem 2rem; background: var(--primary); color: var(--bg); text-decoration: none; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; transition: all 0.3s; }
        .go-shop-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="scanline-overlay"></div>
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-logo" style="text-decoration:none;">E<span class="logo-dot">.</span></a>
            <div class="nav-menu" id="navMenu">
                <a href="../index.html" class="nav-link">ANA SAYFA</a>
                <a href="about.html" class="nav-link">HAKKIMDA</a>
                <a href="project.html" class="nav-link">PROJELER</a>
                <a href="shop.html" class="nav-link">MAĞAZA</a>
                <a href="contact.html" class="nav-link">İLETİŞİM</a>
                <a href="form.html" class="nav-link">FORM</a>
                <div id="navAuthArea"></div>
            </div>
            <div class="year-badge"><span class="pulse-dot"></span>2026</div>
            <button class="theme-toggle" id="themeToggle" title="Tema Değiştir">☀️</button>
            <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
        <div class="mobile-menu" id="mobileMenu">
            <a href="../index.html" class="nav-link">ANA SAYFA</a>
            <a href="about.html" class="nav-link">HAKKIMDA</a>
            <a href="project.html" class="nav-link">PROJELER</a>
            <a href="shop.html" class="nav-link">MAĞAZA</a>
            <a href="contact.html" class="nav-link">İLETİŞİM</a>
            <a href="form.html" class="nav-link">FORM</a>
        </div>
    </nav>

    <main class="pages-container">
        <section id="page-cart" class="page active">
            <div class="section-container">
                <div class="section-header">
                    <span class="section-number">08</span>
                    <div class="section-divider"></div>
                </div>
                <h2 class="section-title">SEPETİM</h2>
                <div id="cartContent"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="../index.html" class="footer-logo" style="text-decoration:none;">E<span class="logo-dot">.</span></a>
        <p class="footer-text">© 2026 Esma — Tüm hakları saklıdır</p>
        <div class="footer-location"><span class="location-dot"></span><span>Kırşehir, TR</span></div>
    </footer>

    <script src="../assests/js/script.js"></script>
    <script>
    async function renderCart() {
        const cartIds = JSON.parse(localStorage.getItem('shopCart') || '[]');
        const content = document.getElementById('cartContent');

        if (cartIds.length === 0) {
            content.innerHTML = `
                <div class="empty-cart">
                    <div class="empty-icon">🛒</div>
                    <p>Sepetiniz boş.</p>
                    <a href="shop.html" class="go-shop-btn">MAĞAZAYA GİT</a>
                </div>`;
            return;
        }

        let products = [];
        try {
            const res = await fetch('../data/products.json');
            const data = await res.json();
            products = data.products.filter(p => cartIds.includes(p.id));
        } catch(e) { content.innerHTML = '<p class="no-data">Ürünler yüklenemedi.</p>'; return; }

        const total = products.reduce((sum, p) => sum + p.price, 0);
        const user = JSON.parse(localStorage.getItem('portfolioUser') || 'null');

        content.innerHTML = `
            <div class="cart-grid">
                <div class="cart-items-list">
                    ${products.map(p => `
                        <div class="cart-item" data-id="${p.id}">
                            <img class="cart-item-img" src="${p.image}" alt="${p.name}">
                            <div class="cart-item-info">
                                <p class="cart-item-cat">${p.category}</p>
                                <h3 class="cart-item-name">${p.name}</h3>
                                <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:0.5rem;">${p.description}</p>
                                <span class="cart-item-price">${p.price.toLocaleString('tr-TR')} ₺</span>
                            </div>
                            <button class="cart-item-remove" onclick="removeFromCart(${p.id})" title="Kaldır">✕</button>
                        </div>
                    `).join('')}
                </div>
                <div class="cart-summary">
                    <h3>SİPARİŞ ÖZETİ</h3>
                    ${products.map(p => `
                        <div class="summary-row">
                            <span>${p.name}</span>
                            <span>${p.price.toLocaleString('tr-TR')} ₺</span>
                        </div>
                    `).join('')}
                    <div class="summary-row total">
                        <span>TOPLAM</span>
                        <span>${total.toLocaleString('tr-TR')} ₺</span>
                    </div>
                    ${user
                        ? `<button class="checkout-btn" onclick="goCheckout()">ÖDEMEYE GEÇ →</button>`
                        : `<button class="checkout-btn" onclick="alert('Ödeme yapmak için lütfen önce giriş yapınız.')">GİRİŞ YAP VE ÖDE</button>
                           <p style="text-align:center;font-size:0.8rem;color:var(--text-light);margin-top:0.7rem;"><a href="form.html" style="color:var(--primary);">Giriş Yap</a> veya <a href="form.html" style="color:var(--primary);">Kayıt Ol</a></p>`
                    }
                    <a href="shop.html" style="display:block;text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--text-light);text-decoration:none;">← Alışverişe Devam Et</a>
                </div>
            </div>`;
    }

    function removeFromCart(productId) {
        let cart = JSON.parse(localStorage.getItem('shopCart') || '[]');
        cart = cart.filter(id => id !== productId);
        localStorage.setItem('shopCart', JSON.stringify(cart));
        updateCartBadge();
        renderCart();
    }

    function goCheckout() {
        window.location.href = 'checkout.html';
    }

    renderCart();
    </script>
</body>
</html>
